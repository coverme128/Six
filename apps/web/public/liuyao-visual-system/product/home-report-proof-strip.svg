<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">六爻报告结果摘要</title><desc id="desc">报告展示总体判断、支持、阻碍和下一步。</desc>
  <rect width="900" height="340" fill="#FFFCF6"/><rect width="900" height="64" fill="#171717"/><text x="30" y="41" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#FBF8F1">问题分析报告</text><text x="868" y="41" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#CFC5B6">历史版式示意</text>
  <text x="30" y="104" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#496F63">总体判断</text><text x="30" y="145" font-family="system-ui,sans-serif" font-size="29" font-weight="760" fill="#171717">可以继续，但先验证关键条件</text>
  <rect x="30" y="178" width="250" height="106" rx="7" fill="#E8EFEB"/><circle cx="56" cy="207" r="10" fill="#496F63"/><text x="78" y="213" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#171717">支持</text><text x="50" y="253" font-family="system-ui,sans-serif" font-size="15" fill="#384C5F">现实条件正在落实</text>
  <rect x="300" y="178" width="250" height="106" rx="7" fill="#F4E5E1"/><circle cx="326" cy="207" r="10" fill="#A33A2B"/><text x="348" y="213" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#171717">阻碍</text><text x="320" y="253" font-family="system-ui,sans-serif" font-size="15" fill="#653B35">承诺尚未变成行动</text>
  <rect x="570" y="178" width="300" height="106" rx="7" fill="#F6F1E7"/><text x="590" y="210" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#9A6A36">下一步</text><circle cx="606" cy="250" r="15" fill="#171717"/><text x="606" y="256" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">1</text><text x="634" y="256" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#171717">确认实际行动时间</text>
</svg>
