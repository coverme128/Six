<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">寻物与物品排查图</title><desc id="desc">按照最后确认、经手路径、重点区域和外部求助四步逐层排查。</desc>
  <rect width="1200" height="600" fill="#FBF8F1"/><path d="M175 300H1025" stroke="#CFC5B6" stroke-width="8" stroke-linecap="round"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><circle cx="190" cy="300" r="74" fill="#171717"/><text x="190" y="310" font-size="36" font-weight="750" fill="#FBF8F1">01</text><text x="190" y="410" font-size="29" font-weight="750" fill="#171717">最后确认</text><text x="190" y="449" font-size="22" fill="#5D5A54">时间 · 地点 · 状态</text>
  <circle cx="460" cy="300" r="74" fill="#E8EFEB" stroke="#496F63" stroke-width="5"/><text x="460" y="310" font-size="36" font-weight="750" fill="#496F63">02</text><text x="460" y="410" font-size="29" font-weight="750" fill="#171717">经手路径</text><text x="460" y="449" font-size="22" fill="#5D5A54">人员 · 路线 · 交付</text>
  <circle cx="740" cy="300" r="74" fill="#EFE8DB" stroke="#9A6A36" stroke-width="5"/><text x="740" y="310" font-size="36" font-weight="750" fill="#9A6A36">03</text><text x="740" y="410" font-size="29" font-weight="750" fill="#171717">重点排查</text><text x="740" y="449" font-size="22" fill="#5D5A54">先查高概率方向</text>
  <circle cx="1010" cy="300" r="74" fill="#F4E5E1" stroke="#A33A2B" stroke-width="5"/><text x="1010" y="310" font-size="36" font-weight="750" fill="#A33A2B">04</text><text x="1010" y="410" font-size="29" font-weight="750" fill="#171717">外部求助</text><text x="1010" y="449" font-size="22" fill="#5D5A54">物业 · 平台 · 报警</text></g>
  <rect x="330" y="76" width="540" height="74" rx="8" fill="#fff" stroke="#384C5F" stroke-width="4"/><text x="600" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#171717">把线索变成可以验证的排查顺序</text>
</svg>
