<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">健康与恢复观察图</title><desc id="desc">以专业诊疗为首要依据，记录身体变化、日常支持和需要及时就医的警示。</desc>
  <rect width="1200" height="600" fill="#FBF8F1"/><circle cx="600" cy="300" r="122" fill="#E8EFEB" stroke="#496F63" stroke-width="6"/><path d="M530 300h48l30-74 46 148 32-74h54" fill="none" stroke="#A33A2B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M485 225L350 130M715 225l135-95M485 375l-135 95M715 375l135 95" stroke="#CFC5B6" stroke-width="6"/>
  <rect x="105" y="65" width="310" height="130" rx="8" fill="#fff" stroke="#384C5F" stroke-width="4"/><text x="260" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#171717">身体变化</text><text x="260" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#5D5A54">如实记录，不自行诊断</text>
  <rect x="785" y="65" width="310" height="130" rx="8" fill="#fff" stroke="#496F63" stroke-width="4"/><text x="940" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#171717">专业诊疗</text><text x="940" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#5D5A54">检查与医嘱优先</text>
  <rect x="105" y="405" width="310" height="130" rx="8" fill="#fff" stroke="#9A6A36" stroke-width="4"/><text x="260" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#171717">日常支持</text><text x="260" y="503" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#5D5A54">休息 · 照护 · 复诊</text>
  <rect x="785" y="405" width="310" height="130" rx="8" fill="#F4E5E1" stroke="#A33A2B" stroke-width="4"/><text x="940" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#171717">及时升级</text><text x="940" y="503" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#5D5A54">异常变化立即就医</text>
</svg>
