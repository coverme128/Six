<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">感情与关系的双向关系场</title>
  <desc id="desc">从自己与对方的状态，观察沟通、距离和关系变化，再选择靠近、观察或设定边界。</desc>
  <rect width="1200" height="600" fill="#FBF8F1"/>
  <path d="M360 300 C430 190 520 180 600 280" fill="none" stroke="#A33A2B" stroke-width="8" stroke-linecap="round"/>
  <path d="M840 300 C770 410 680 420 600 320" fill="none" stroke="#496F63" stroke-width="8" stroke-linecap="round"/>
  <path d="M360 300 C435 395 505 405 600 320" fill="none" stroke="#CFC5B6" stroke-width="4" stroke-dasharray="12 12"/>
  <path d="M840 300 C765 205 695 195 600 280" fill="none" stroke="#CFC5B6" stroke-width="4" stroke-dasharray="12 12"/>
  <circle cx="300" cy="300" r="104" fill="#EFE8DB" stroke="#A33A2B" stroke-width="4"/>
  <circle cx="900" cy="300" r="104" fill="#E8EFEB" stroke="#496F63" stroke-width="4"/>
  <circle cx="600" cy="300" r="82" fill="#171717"/>
  <text x="300" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#171717">自己的状态</text>
  <text x="300" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#5D5A54">投入与边界</text>
  <text x="900" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#171717">对方的回应</text>
  <text x="900" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#5D5A54">行动与距离</text>
  <text x="600" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#FBF8F1">关系</text>
  <text x="600" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#EFE8DB">正在怎样变化</text>
  <rect x="448" y="70" width="304" height="66" rx="8" fill="#FFFFFF" stroke="#CFC5B6" stroke-width="3"/>
  <text x="600" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="650" fill="#384C5F">沟通与现实条件</text>
  <line x1="600" y1="136" x2="600" y2="212" stroke="#CFC5B6" stroke-width="3"/>
  <rect x="246" y="480" width="708" height="72" rx="8" fill="#FFFFFF" stroke="#CFC5B6" stroke-width="3"/>
  <line x1="482" y1="480" x2="482" y2="552" stroke="#CFC5B6" stroke-width="2"/>
  <line x1="718" y1="480" x2="718" y2="552" stroke="#CFC5B6" stroke-width="2"/>
  <text x="364" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="29" font-weight="700" fill="#A33A2B">适合靠近</text>
  <text x="600" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="29" font-weight="700" fill="#384C5F">继续观察</text>
  <text x="836" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="29" font-weight="700" fill="#496F63">设定边界</text>
</svg>
