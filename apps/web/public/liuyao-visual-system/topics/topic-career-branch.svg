<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">事业与工作的分叉决策树</title>
  <desc id="desc">从当前处境出发，比较继续争取和转向新机会两条路径，经过条件核验后再作决定。</desc>
  <rect width="1200" height="600" fill="#FBF8F1"/>
  <rect x="455" y="55" width="290" height="84" rx="8" fill="#171717"/>
  <text x="600" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#FBF8F1">现在的工作处境</text>
  <path d="M600 139 V205 M600 205 C600 245 350 225 350 280 M600 205 C600 245 850 225 850 280" fill="none" stroke="#384C5F" stroke-width="6"/>
  <circle cx="600" cy="205" r="12" fill="#A33A2B"/>
  <rect x="150" y="280" width="400" height="174" rx="8" fill="#EFE8DB" stroke="#9A6A36" stroke-width="4"/>
  <rect x="650" y="280" width="400" height="174" rx="8" fill="#E8EFEB" stroke="#496F63" stroke-width="4"/>
  <text x="350" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="750" fill="#171717">继续争取</text>
  <text x="350" y="388" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#5D5A54">晋升空间 · 内部支持</text>
  <text x="350" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#5D5A54">投入是否值得</text>
  <text x="850" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="750" fill="#171717">转向新机会</text>
  <text x="850" y="388" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#5D5A54">机会质量 · 现实成本</text>
  <text x="850" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#5D5A54">条件是否落实</text>
  <path d="M350 454 V504 H850 V454" fill="none" stroke="#CFC5B6" stroke-width="5"/>
  <rect x="428" y="490" width="344" height="70" rx="8" fill="#FFFFFF" stroke="#A33A2B" stroke-width="3"/>
  <text x="600" y="535" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#A33A2B">核验条件，再决定</text>
</svg>
