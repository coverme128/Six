<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ED-LY-005 Social Share Card</title>
  <desc id="desc">A 1200 by 630 social share template for Liuyao content.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#EFE8DB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#F6F1E7"/>
  <rect x="48" y="48" width="1104" height="534" rx="8" fill="url(#paper)" stroke="#CFC5B6"/>
