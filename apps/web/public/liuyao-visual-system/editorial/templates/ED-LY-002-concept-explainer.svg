<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ED-LY-002 Concept Explainer</title>
  <desc id="desc">A deterministic editorial SVG template for explaining Liuyao concepts without encoding report facts.</desc>
  <rect width="1200" height="630" fill="#F6F1E7"/>
  <rect x="60" y="56" width="1080" height="518" rx="8" fill="#FBF8F1" stroke="#CFC5B6"/>
