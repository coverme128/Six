    <line x1="24" y1="122" x2="210" y2="122" stroke="#171717" stroke-width="8" stroke-linecap="round"/>
    <line x1="24" y1="146" x2="210" y2="146" stroke="#171717" stroke-width="8" stroke-linecap="round" stroke-dasharray="78 30 78"/>
  </g>
  <g transform="translate(475 276)">
