<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">ED-LY-009 Report Summary Card</title>
  <desc id="desc">A square report summary card template for Liuyao reports.</desc>
  <rect width="1200" height="1200" fill="#F6F1E7"/>
  <rect x="72" y="72" width="1056" height="1056" rx="10" fill="#FBF8F1" stroke="#CFC5B6" stroke-width="2"/>
  <text x="120" y="160" fill="#A33A2B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">REPORT SUMMARY</text>
  <text x="120" y="250" fill="#171717" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="650">六爻报告摘要卡</text>
  <text x="120" y="314" fill="#5D5A54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28">用于分享结论结构，不替代完整报告依据</text>
  <g transform="translate(120 402)">
    <rect width="960" height="154" rx="10" fill="#EFE8DB" stroke="#CFC5B6"/>
    <text x="30" y="58" fill="#384C5F" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">总体判断</text>
    <text x="30" y="112" fill="#171717" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="650">有利、有阻、正在变化</text>
  </g>
  <g transform="translate(120 604)">
    <rect width="300" height="230" rx="10" fill="#FBF8F1" stroke="#CFC5B6"/>
    <text x="24" y="50" fill="#496F63" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">核心焦点</text>
    <text x="24" y="98" fill="#5D5A54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">由正式规则确定</text>
    <circle cx="86" cy="164" r="18" fill="#496F63"/>
    <circle cx="174" cy="164" r="18" fill="#9A7A43"/>
    <path d="M104 164 C128 136 148 136 156 164" fill="none" stroke="#384C5F" stroke-width="5"/>
    <rect x="330" width="300" height="230" rx="10" fill="#FBF8F1" stroke="#CFC5B6"/>
    <text x="354" y="50" fill="#9A7A43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">支持 / 风险</text>
    <text x="354" y="98" fill="#5D5A54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">并列展示，不打分</text>
    <line x1="354" y1="152" x2="580" y2="152" stroke="#496F63" stroke-width="10" stroke-linecap="round"/>
    <line x1="354" y1="190" x2="514" y2="190" stroke="#A33A2B" stroke-width="10" stroke-linecap="round"/>
    <rect x="660" width="300" height="230" rx="10" fill="#FBF8F1" stroke="#CFC5B6"/>
    <text x="684" y="50" fill="#384C5F" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">时间线索</text>
    <text x="684" y="98" fill="#5D5A54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">候选窗口，不保证日期</text>
    <path d="M700 172 H910" stroke="#384C5F" stroke-width="5"/>
    <circle cx="730" cy="172" r="12" fill="#9A7A43"/>
    <circle cx="820" cy="172" r="12" fill="#496F63"/>
    <circle cx="910" cy="172" r="12" fill="#A33A2B"/>
  </g>
  <text x="120" y="1044" fill="#5D5A54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">本卡只概括正式报告事实；医疗、法律、投资等现实决策请咨询专业人士。</text>
</svg>
