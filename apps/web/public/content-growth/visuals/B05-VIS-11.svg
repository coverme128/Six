<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><title>支持、风险、不确定性到行动</title><rect width="100%" height="100%" fill="#FCFAF4"/><text x="60" y="82" font-size="34" font-weight="600" fill="#252525">支持、风险、不确定性到行动</text><text x="60" y="128" font-size="20" fill="#5B625F">现实任务 → 结构化理解 → 可核实行动</text><rect x="48" y="210" width="262" height="112" rx="14" fill="#F7F3E8" stroke="#315F5A" stroke-width="2"/><text x="179.0" y="260" text-anchor="middle" font-size="21" fill="#2A2A2A">支持</text><line x1="310" y1="266" x2="328" y2="266" stroke="#315F5A" stroke-width="3"/><path d="M 321 259 L 328 266 L 321 273" fill="none" stroke="#315F5A" stroke-width="3"/><rect x="328" y="210" width="262" height="112" rx="14" fill="#F7F3E8" stroke="#315F5A" stroke-width="2"/><text x="459.0" y="260" text-anchor="middle" font-size="21" fill="#2A2A2A">风险</text><line x1="590" y1="266" x2="608" y2="266" stroke="#315F5A" stroke-width="3"/><path d="M 601 259 L 608 266 L 601 273" fill="none" stroke="#315F5A" stroke-width="3"/><rect x="608" y="210" width="262" height="112" rx="14" fill="#F7F3E8" stroke="#315F5A" stroke-width="2"/><text x="739.0" y="260" text-anchor="middle" font-size="21" fill="#2A2A2A">不确定性</text><line x1="870" y1="266" x2="888" y2="266" stroke="#315F5A" stroke-width="3"/><path d="M 881 259 L 888 266 L 881 273" fill="none" stroke="#315F5A" stroke-width="3"/><rect x="888" y="210" width="262" height="112" rx="14" fill="#F7F3E8" stroke="#315F5A" stroke-width="2"/><text x="1019.0" y="260" text-anchor="middle" font-size="21" fill="#2A2A2A">行动</text><text x="60" y="490" font-size="18" fill="#7A4E3A">图示用于理解决策结构，不替代正式规则、官方信息或专业建议。</text></svg>