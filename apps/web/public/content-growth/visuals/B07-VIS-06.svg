<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Guided vs Professional 总对照</title><desc id="desc">Guided vs Professional 总对照，展示六爻知识、报告或产品流程的结构关系。</desc><rect width="1280" height="640" fill="#FCFAF4"/><text x="64" y="72" font-size="34" font-weight="600" fill="#242828">Guided vs Professional 总对照</text><text x="64" y="110" font-size="18" fill="#65706C">东方专业 · 现代知识系统 · 结构化表达</text><rect x="110" y="190" width="450" height="300" rx="24" fill="#F4F0E6" stroke="#315F59" stroke-width="2"/><rect x="720" y="190" width="450" height="300" rx="24" fill="#EEF3EE" stroke="#315F59" stroke-width="2"/><text x="335" y="240" text-anchor="middle" font-size="28" fill="#27312F">Guided</text><text x="945" y="240" text-anchor="middle" font-size="28" fill="#27312F">Professional</text><text x="335" y="315" text-anchor="middle" font-size="24" fill="#4C5C58">理解</text><text x="335" y="390" text-anchor="middle" font-size="24" fill="#4C5C58">行动</text><text x="945" y="315" text-anchor="middle" font-size="24" fill="#4C5C58">核验</text><text x="945" y="390" text-anchor="middle" font-size="24" fill="#4C5C58">深入</text><text x="640" y="555" text-anchor="middle" font-size="18" fill="#7A4E3A">同一事实，不同表达深度；不是不同结论。</text><text x="64" y="600" font-size="17" fill="#7A4E3A">图示用于理解产品与知识结构；不代表吉凶概率，也不新增专业规则。</text></svg>