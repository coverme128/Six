<svg data-visual-system="LIUYAO_VISUAL_SYSTEM_V1" data-style="modern-eastern-analytical" data-canonicalization="content-growth-visual-style-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><metadata>{"visualSystem":"LIUYAO_VISUAL_SYSTEM_V1","style":"Modern Eastern Analytical","assetClass":"content_growth_legacy_svg","canonicalization":"content-growth-visual-style-v1"}</metadata><title id="title">Guided vs Professional 总对照</title><desc id="desc">Guided vs Professional 总对照，展示六爻知识、报告或产品流程的结构关系。</desc><rect width="1280" height="640" fill="#F6F1E7"/><text x="64" y="72" font-size="34" font-weight="600" fill="#171717">Guided vs Professional 总对照</text><text x="64" y="110" font-size="18" fill="#5D5A54">东方专业 · 现代知识系统 · 结构化表达</text><rect x="110" y="190" width="450" height="300" rx="8" fill="#EFE8DB" stroke="#496F63" stroke-width="2"/><rect x="720" y="190" width="450" height="300" rx="8" fill="#EFE8DB" stroke="#496F63" stroke-width="2"/><text x="335" y="240" text-anchor="middle" font-size="28" fill="#171717">Guided</text><text x="945" y="240" text-anchor="middle" font-size="28" fill="#171717">Professional</text><text x="335" y="315" text-anchor="middle" font-size="24" fill="#5D5A54">理解</text><text x="335" y="390" text-anchor="middle" font-size="24" fill="#5D5A54">行动</text><text x="945" y="315" text-anchor="middle" font-size="24" fill="#5D5A54">核验</text><text x="945" y="390" text-anchor="middle" font-size="24" fill="#5D5A54">深入</text><text x="640" y="555" text-anchor="middle" font-size="18" fill="#9A6A36">同一事实，不同表达深度；不是不同结论。</text><text x="64" y="600" font-size="17" fill="#9A6A36">图示用于理解产品与知识结构；不代表吉凶概率，也不新增专业规则。</text></svg>