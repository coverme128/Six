<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Guided 与 Professional 如何呈现用神</title><desc id="desc">同一事实，不同信息密度</desc><rect width="1200" height="720" fill="#F7F4EC"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#2E3432">Guided 与 Professional 如何呈现用神</text><text x="60" y="112" font-family="sans-serif" font-size="20" fill="#496E67">同一事实，不同信息密度</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#496E67"/></marker></defs><rect x="265" y="150" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#CBD2CD" stroke-width="2"/><text x="415.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2E3432">Guided：核心观察对象 → 为什么重要 → 支持 / 阻碍</text><rect x="635" y="150" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#CBD2CD" stroke-width="2"/><text x="785.0" y="198" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2E3432">Professional：用神 → 角色来源 → 六亲 → 世应 → 依据</text><path d="M 565 195.0 L 635 195.0" stroke="#496E67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="640" width="1080" height="44" rx="10" fill="#F0ECE2"/><text x="600" y="669" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9A5B4A">同一事实，不同信息密度</text></svg>