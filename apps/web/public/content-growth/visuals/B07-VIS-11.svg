<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">现实问题 Topic Map</title><desc id="desc">现实问题 Topic Map，展示六爻知识、报告或产品流程的结构关系。</desc><rect width="1280" height="640" fill="#FCFAF4"/><text x="64" y="72" font-size="34" font-weight="600" fill="#242828">现实问题 Topic Map</text><text x="64" y="110" font-size="18" fill="#65706C">东方专业 · 现代知识系统 · 结构化表达</text><circle cx="640" cy="330" r="82" fill="#EEF3EE" stroke="#2F625C" stroke-width="2"/><text x="640" y="340" text-anchor="middle" font-size="24" fill="#26302E">现实决策</text><rect x="570.0" y="105.0" width="140" height="70" rx="14" fill="#F5F1E7" stroke="#6A807A"/><text x="640.0" y="147.0" text-anchor="middle" font-size="20" fill="#2A302E">事业</text><line x1="640" y1="330" x2="640.0" y2="140.0" stroke="#8DA49D" stroke-width="2"/><rect x="786.5" y="200.0" width="140" height="70" rx="14" fill="#F5F1E7" stroke="#6A807A"/><text x="856.5" y="242.0" text-anchor="middle" font-size="20" fill="#2A302E">商业</text><line x1="640" y1="330" x2="856.5" y2="235.0" stroke="#8DA49D" stroke-width="2"/><rect x="786.5" y="390.0" width="140" height="70" rx="14" fill="#F5F1E7" stroke="#6A807A"/><text x="856.5" y="432.0" text-anchor="middle" font-size="20" fill="#2A302E">资金</text><line x1="640" y1="330" x2="856.5" y2="425.0" stroke="#8DA49D" stroke-width="2"/><rect x="570.0" y="485.0" width="140" height="70" rx="14" fill="#F5F1E7" stroke="#6A807A"/><text x="640.0" y="527.0" text-anchor="middle" font-size="20" fill="#2A302E">关系</text><line x1="640" y1="330" x2="640.0" y2="520.0" stroke="#8DA49D" stroke-width="2"/><rect x="353.5" y="390.0" width="140" height="70" rx="14" fill="#F5F1E7" stroke="#6A807A"/><text x="423.5" y="432.0" text-anchor="middle" font-size="20" fill="#2A302E">考试</text><line x1="640" y1="330" x2="423.5" y2="425.0" stroke="#8DA49D" stroke-width="2"/><rect x="353.5" y="200.0" width="140" height="70" rx="14" fill="#F5F1E7" stroke="#6A807A"/><text x="423.5" y="242.0" text-anchor="middle" font-size="20" fill="#2A302E">出行</text><line x1="640" y1="330" x2="423.5" y2="235.0" stroke="#8DA49D" stroke-width="2"/><text x="64" y="600" font-size="17" fill="#7A4E3A">图示用于理解产品与知识结构；不代表吉凶概率，也不新增专业规则。</text></svg>