<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">一份六爻报告到底是怎样生成的</title><desc id="desc">一份六爻报告到底是怎样生成的，关键不是多记几个术语，而是先知道知识、工具和报告之间是什么关系。</desc><rect width="1080" height="1920" fill="#F6F1E7"/><rect x="0" y="0" width="1080" height="28" fill="#A33A2B"/><text x="82" y="130" fill="#A33A2B" font-size="30" font-weight="700" font-family="system-ui, sans-serif">六爻短视频 · 55–80 秒</text><text x="82" y="292" text-anchor="start" fill="#171717" font-size="72" font-weight="780" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="82" dy="0">一份六爻报告到底是怎样生</tspan><tspan x="82" dy="92">成的</tspan></text><circle cx="540" cy="1040" r="270" fill="#FFFCF6" stroke="#A33A2B" stroke-width="10"/><circle cx="540" cy="1040" r="210" fill="none" stroke="#CFC5B6" stroke-width="2"/><path d="M 500 920 L 500 1160 L 680 1040 Z" fill="#A33A2B"/><text x="82" y="1490" text-anchor="start" fill="#171717" font-size="42" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="82" dy="0">一份六爻报告到底是怎样生成的，关键不</tspan><tspan x="82" dy="62">是多记几个术语，而是先知道知识、工具</tspan><tspan x="82" dy="62">和报告之间是什么关系。</tspan></text><rect x="82" y="1740" width="916" height="92" rx="8" fill="#A33A2B"/><text x="540" y="1798" text-anchor="middle" fill="#fff" font-size="34" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="540" dy="0">进入六爻学习中心</tspan></text></svg>
