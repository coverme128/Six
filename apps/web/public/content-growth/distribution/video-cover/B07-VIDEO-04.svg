<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">为什么六爻不是只看一个“吉凶”</title><desc id="desc">为什么六爻不是只看一个“吉凶”，关键不是多记几个术语，而是先知道知识、工具和报告之间是什么关系。</desc><rect width="1080" height="1920" fill="#F6F1E7"/><rect x="0" y="0" width="1080" height="28" fill="#48677A"/><text x="82" y="130" fill="#48677A" font-size="30" font-weight="700" font-family="system-ui, sans-serif">六爻短视频 · 55–80 秒</text><text x="82" y="292" text-anchor="start" fill="#171717" font-size="72" font-weight="780" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="82" dy="0">为什么六爻不是只看一个“</tspan><tspan x="82" dy="92">吉凶”</tspan></text><circle cx="540" cy="1040" r="270" fill="#FFFCF6" stroke="#48677A" stroke-width="10"/><circle cx="540" cy="1040" r="210" fill="none" stroke="#CFC5B6" stroke-width="2"/><path d="M 500 920 L 500 1160 L 680 1040 Z" fill="#48677A"/><text x="82" y="1490" text-anchor="start" fill="#171717" font-size="42" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="82" dy="0">为什么六爻不是只看一个“吉凶”，关键</tspan><tspan x="82" dy="62">不是多记几个术语，而是先知道知识、工</tspan><tspan x="82" dy="62">具和报告之间是什么关系。</tspan></text><rect x="82" y="1740" width="916" height="92" rx="8" fill="#48677A"/><text x="540" y="1798" text-anchor="middle" fill="#fff" font-size="34" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="540" dy="0">查看完整内容</tspan></text></svg>
