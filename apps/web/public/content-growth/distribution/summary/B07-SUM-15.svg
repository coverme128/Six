<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">当多条六爻证据互相冲突时，应该怎样理解</title><desc id="desc">Evidence Conflict 描述的是多个专业事实或规则在当前问题上给出不同方向的信息，需要经过正式冲突解决逻辑后再进入用户结论。 AI 只能解释 Conflict Resolver 已输出的状态，不能挑选自己喜欢的证据，也不能为了流畅把冲突隐藏掉。</desc><rect width="1200" height="675" fill="#F6F1E7"/><rect x="0" y="0" width="20" height="675" fill="#9A7A43"/><text x="72" y="72" fill="#9A7A43" font-size="18" font-weight="700" font-family="system-ui, sans-serif">专业 · B07-SUM-15</text><text x="72" y="142" text-anchor="start" fill="#171717" font-size="40" font-weight="760" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="72" dy="0">当多条六爻证据互相冲突时，应该怎样理解</tspan></text><rect x="72" y="260" width="1056" height="260" rx="8" fill="#FFFCF6" stroke="#CFC5B6"/><circle cx="118" cy="326" r="16" fill="#9A7A43"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">1</text><text x="156" y="334" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">理解并核验当多条六爻证据互相冲突时，应该怎样理解</tspan></text><circle cx="118" cy="396" r="16" fill="#9A7A43"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">2</text><text x="156" y="404" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">查看相关支持与限制</tspan></text><circle cx="118" cy="466" r="16" fill="#9A7A43"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">3</text><text x="156" y="474" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI'