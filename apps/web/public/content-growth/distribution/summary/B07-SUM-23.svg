<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">出行前，六爻可以帮助确认哪些问题</title><desc id="desc">出行前梳理计划与风险时，不要把六爻压缩成“成或不成”。更有效的方式是把问题拆成对象、角色、支持、阻碍、变化、时间与现实核验，再把报告转成下一步行动。</desc><rect width="1200" height="675" fill="#F6F1E7"/><rect x="0" y="0" width="20" height="675" fill="#9A7A43"/><text x="72" y="72" fill="#9A7A43" font-size="18" font-weight="700" font-family="system-ui, sans-serif">现实决策 · B07-SUM-23</text><text x="72" y="142" text-anchor="start" fill="#171717" font-size="40" font-weight="760" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="72" dy="0">出行前，六爻可以帮助确认哪些问题</tspan></text><rect x="72" y="260" width="1056" height="260" rx="8" fill="#FFFCF6" stroke="#CFC5B6"/><circle cx="118" cy="326" r="16" fill="#9A7A43"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">1</text><text x="156" y="334" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">出行前梳理计划与风险</tspan></text><circle cx="118" cy="396" r="16" fill="#9A7A43"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">2</text><text x="156" y="404" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">查看相关支持与限制</tspan></text><circle cx="118" cy="466" r="16" fill="#9A7A43"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">3</text><text x="156" y="474" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">进入完整内容核验上下文</tspan></text><text x="7