<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">六亲为什么不是字面意义上的父母、兄弟、子孙、妻财、官鬼</title><desc id="desc">六亲在六爻中承担的是结构化角色分类。名称来自传统体系，但进入现实问题时，需要结合问题主题解释为文书、资源、竞争、产出、收益、职责等不同角色。本文重点说明建立“六亲是角色分类系统”的现代 Mental Model，避免字面主义。同时区分内容解释、项目正式规则与后续判断边界，帮助普通用户看懂报告，</desc><rect width="1200" height="675" fill="#F6F1E7"/><rect x="0" y="0" width="20" height="675" fill="#48677A"/><text x="72" y="72" fill="#48677A" font-size="18" font-weight="700" font-family="system-ui, sans-serif">专业 · B07-SUM-10</text><text x="72" y="142" text-anchor="start" fill="#171717" font-size="40" font-weight="760" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="72" dy="0">六亲为什么不是字面意义上的父母、兄弟、子孙、妻财</tspan><tspan x="72" dy="54">、官鬼</tspan></text><rect x="72" y="260" width="1056" height="260" rx="8" fill="#FFFCF6" stroke="#CFC5B6"/><circle cx="118" cy="326" r="16" fill="#48677A"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">1</text><text x="156" y="334" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">建立“六亲是角色分类系统”的现代 Mental…</tspan></text><circle cx="118" cy="396" r="16" fill="#48677A"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">2</text><text x="156" y="404" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">查看相关支持与限制</tspan></text><circle cx="118" cy="466" r="16" fill="#48677A"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">3</text><text x="156" y="474" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font