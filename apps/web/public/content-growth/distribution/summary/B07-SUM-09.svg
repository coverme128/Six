<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">六爻中的“用神”到底是什么</title><desc id="desc">用神是问题驱动的专业焦点：系统先理解用户问什么，再依据正式角色与用神规则确定需要重点观察的对象。本文重点说明把用神理解为本次问题的核心观察对象，而不是所谓“最吉利的爻”。同时区分内容解释、项目正式规则与后续判断边界，帮助普通用户看懂报告，也让 Professional 用户能够核验角色来源。</desc><rect width="1200" height="675" fill="#F6F1E7"/><rect x="0" y="0" width="20" height="675" fill="#496F63"/><text x="72" y="72" fill="#496F63" font-size="18" font-weight="700" font-family="system-ui, sans-serif">专业 · B07-SUM-09</text><text x="72" y="142" text-anchor="start" fill="#171717" font-size="40" font-weight="760" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="72" dy="0">六爻中的“用神”到底是什么</tspan></text><rect x="72" y="260" width="1056" height="260" rx="8" fill="#FFFCF6" stroke="#CFC5B6"/><circle cx="118" cy="326" r="16" fill="#496F63"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">1</text><text x="156" y="334" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">把用神理解为本次问题的核心观察对象，而不是所谓“最吉利的爻”。</tspan></text><circle cx="118" cy="396" r="16" fill="#496F63"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">2</text><text x="156" y="404" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="156" dy="0">查看相关支持与限制</tspan></text><circle cx="118" cy="466" r="16" fill="#496F63"/><text x="118" y="332" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">3</text><text x="156" y="474" text-anchor="start" fill="#171717" font-size="22" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFon